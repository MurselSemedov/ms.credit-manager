databaseChangeLog:
  - changeSet:
      id: 202531031949
      author: Mursal Samadov
      changes:
        - createTable:
            tableName: credits
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: numeric(16,2)
                  constraints:
                    nullable: false
              - column:
                  name: term
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: interest
                  type: numeric(16,2)
                  constraints:
                    nullable: false
              - column:
                  name: monthly_payment
                  type: numeric(16,2)
                  constraints:
                    nullable: false
              - column:
                  name: requested_amount
                  type: numeric(16,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: check_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValue: now()
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_credits_customers
                    references: customers(id)
                    nullable: false

            remarks: Table to store information about credits