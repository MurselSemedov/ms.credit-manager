databaseChangeLog:
  - changeSet:
      id: 202531031951
      author: Mursal Samadov
      changes:
        - createTable:
            tableName: status_histories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValue: now()
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: credit_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_status_histories_credits
                    references: credits(id)
                    nullable: false
            remarks: Table to store information about status_histories