databaseChangeLog:
  - changeSet:
      id: Add Foreign Keys
      author: Mursal Samadov
      changes:
        - addForeignKeyConstraint:
            baseTableName: credits
            baseColumnNames: customer_id
            constraintName: fk_customer_credits
            referencedTableName: customers
            referencedColumnNames: id
        - addForeignKeyConstraint:
              baseTableName: offers
              baseColumnNames: credit_id
              constraintName: fk_credit_offers
              referencedTableName: credits
              referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: status_histories
            baseColumnNames: credit_id
            constraintName: fk_credit_status_histories
            referencedTableName: credits
            referencedColumnNames: id